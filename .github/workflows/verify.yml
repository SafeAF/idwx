name: Verify frost site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.tmp/uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: uv sync --locked
      - run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - run: uv run ruff check .
      - run: uv run pytest -q --maxfail=1 -p no:cacheprovider --basetemp .tmp/ci-pytest
      - run: pnpm --dir web test
      - name: Verify Nginx delivery and rollback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes nginx
          IDWX_NGINX="$(command -v nginx)" uv run pytest -q --maxfail=1 -p no:cacheprovider --basetemp .tmp/ci-nginx tests/test_nginx.py
      - run: uv run idwx export-web --demo --output .tmp/verified-site
      - run: uv run idwx verify-web .tmp/verified-site --allow-demo
      - run: uv run idwx package-web .tmp/verified-site --allow-demo --output .tmp/delivery/idwx-demo-site.zip
      - run: uv run idwx export-web --output .tmp/verified-real-site
      - run: uv run idwx verify-web .tmp/verified-real-site
      - run: uv run idwx package-web .tmp/verified-real-site --output .tmp/delivery/idwx-twin-falls-site.zip
      - run: uv build --wheel --out-dir .tmp/delivery/wheels
      - run: uv run python scripts/check_wheel.py .tmp/delivery/wheels
      - run: uv run python scripts/check_wheel.py .tmp/delivery/wheels --installed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: idwx-delivery-${{ runner.os }}
          path: |
            .tmp/delivery/idwx-demo-site.zip
            .tmp/delivery/idwx-twin-falls-site.zip
            .tmp/delivery/wheels/*.whl
          if-no-files-found: error
