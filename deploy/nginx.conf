# Replace domain, document root, and certificate paths before installing.
# Include this file inside nginx.conf's http {} block.
server {
    listen 80;
    server_name frost.example.com;
    return 301 https://frost.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name frost.example.com;
    root /srv/idwx/current;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/frost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frost.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include mime.types;
    types { text/csv csv; }
    default_type application/octet-stream;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json text/csv image/svg+xml;

    # No inline scripts, third-party fonts, analytics, or external API requests.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Deny dotfiles and exporter staging directories before the release regex.
    location ~ (^|/)\. { deny all; }

    location = /data/manifest.json {
        try_files $uri =404;
        expires -1;
        # Security headers are repeated where add_header overrides inheritance.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ "^/data/[a-f0-9]{64}/" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /data/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
